name: Publish to NuGet

# Two ways to run this:
#   1. Push a tag like "v0.2.0" -- builds and publishes that exact version.
#      Tagging a release IS the deliberate "publish this" signal, so this
#      path always pushes to nuget.org (no extra confirmation gate).
#   2. Manually via "Run workflow" (workflow_dispatch) -- defaults to a dry
#      run (build + pack only, no push) unless the "publish" input is
#      explicitly set to true. This is the safety rail for testing the
#      pipeline itself without risking an accidental, irreversible publish.
#
# Auth: Trusted Publishing (OIDC), not a long-lived API key -- nuget.org
# exchanges this job's short-lived GitHub-issued OIDC token for a temporary
# (1 hour) NuGet API key at publish time; nothing durable is ever stored as
# a GitHub secret. See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing.
# Before this workflow can push anything, a Trusted Publishing policy must
# be registered on nuget.org (sign in -> username -> Trusted Publishing ->
# add policy) pointing at:
#   Repository Owner: Aban-Inc
#   Repository:       nafas.observability.package
#   Workflow File:    publish.yml   (filename only, not the .github/workflows/ path)
# and a NUGET_USER repository secret holding the nuget.org *username*
# (profile name, not email) that owns that policy.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to pack (blank = use Nafas.Observability.csproj's own <Version>)"
        required: false
        type: string
      publish:
        description: "Actually push to nuget.org (unchecked = dry run: build + pack only)"
        required: false
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the GitHub OIDC token Trusted Publishing exchanges for a temp NuGet API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Nafas.Observability/ClientApp/package-lock.json

      # Rebuild the dashboard UI from source rather than trusting whatever
      # happens to be committed in wwwroot/ -- catches the mistake of
      # tagging a release after a ClientApp change that was never rebuilt
      # and re-synced locally (see README.md's own build/embed workflow
      # notes).
      - name: Build dashboard UI (ClientApp)
        working-directory: Nafas.Observability/ClientApp
        run: |
          npm ci
          npm run build

      - name: Sync built UI into wwwroot
        working-directory: Nafas.Observability
        run: |
          rm -rf wwwroot/assets wwwroot/index.html wwwroot/favicon.svg wwwroot/icons.svg
          cp -r ClientApp/dist/. wwwroot/

      - name: Determine package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Strip the leading "v" from a tag like "v0.2.0" -> "0.2.0".
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: '${VERSION:-<csproj default>}'"

      - name: dotnet pack
        working-directory: Nafas.Observability
        run: |
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            dotnet pack -c Release -o ../artifacts -p:Version=${{ steps.version.outputs.version }}
          else
            dotnet pack -c Release -o ../artifacts
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      # Same "actually publish?" condition on both of the steps below: a
      # tag push always does (that's the deliberate release signal), a
      # manual run only if "publish" was explicitly checked (defaults to a
      # dry run otherwise).
      #
      # Exchanges this job's OIDC token for a temporary (1h) NuGet API key --
      # only requested right before it's used, per NuGet's own guidance,
      # and only on a run that's actually going to publish.
      - name: NuGet login (OIDC -> temp API key)
        if: github.event_name == 'push' || inputs.publish == true
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: github.event_name == 'push' || inputs.publish == true
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
